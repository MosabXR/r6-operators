<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R6 Operator Details</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        max-width: 800px;
        margin: 0 auto;
      }

      .card {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s;
        display: flex;
        justify-content: center;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card img {
        width: 500px;
        height: 500px;
        object-fit: cover;
        object-position: top;
      }

      .card-content {
        padding: 20px;
      }

      .card-content h3 {
        margin-bottom: 10px;
        font-size: 1.5rem;
        color: #333;
      }

      .card-content p {
        font-size: 1rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 15px;
      }

      .card-content a {
        display: inline-block;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }

      .card-content a:hover {
        background-color: #0056b3;
      }

      .details-section {
        margin-top: 20px;
      }

      .details-section h4 {
        font-size: 1.2rem;
        color: #333;
        margin-bottom: 10px;
      }

      .details-section ul {
        list-style: none;
        font-size: 1rem;
        color: #666;
        line-height: 1.6;
      }

      .details-section ul li {
        margin-bottom: 10px;
      }

      .details-section ul li strong {
        color: #333;
      }

      @media (min-width: 620px) {
        .grid-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="grid-container">
        <div class="card">
          <img src="{%IMAGE%}" alt="{%NAME%}" />
          <div class="card-content">
            <h3>{%NAME%}</h3>
            <p>{%DESCRIPTION%}</p>
            <div class="details-section">
              <h4>Operator Profile</h4>
              <ul>
                <li><strong>Role:</strong> {%ROLE%}</li>
                <li><strong>Gadget:</strong> {%GADGET%}</li>
                <li><strong>Primary Weapons:</strong> {%PRIMARY_WEAPONS%}</li>
                <li>
                  <strong>Secondary Weapons:</strong> {%SECONDARY_WEAPONS%}
                </li>
                <li><strong>Armor Rating:</strong> {%ARMOR%}</li>
                <li><strong>Speed Rating:</strong> {%SPEED%}</li>
                <li><strong>Unit:</strong> {%UNIT%}</li>
              </ul>
              <a href="/overview">Back</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
